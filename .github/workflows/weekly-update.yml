name: Weekly forecast update

on:
  schedule:
    - cron: "0 6 * * 6"        # Saturday 06:00 UTC, after Friday's US close
  workflow_dispatch:            # lets you also run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Restore previous results (tracking log, scorecards)
        run: |
          mkdir -p output
          cp -r snapshot/output/. output/

      - name: Run the weekly pipeline
        run: python run_weekly.py

      - name: Check the new snapshot is complete and fresh
        run: python check_snapshot.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot dashboard
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Weekly update $(date -u +%F)"
            git push
          fi
